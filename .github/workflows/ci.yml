name: CI

# Все проверки QA (qa/full-check): тесты и покрытие, фаззинг API, безопасность, миграции, приложение.
# Нагрузочные тесты (tests/load) сюда не входят: их запускают вручную на тестовом сервере.

on:
  push:
  pull_request:

# Новый запуск той же ветки отменяет предыдущий (экономия минут).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # К-33 А7: сервер проверяется на PostgreSQL 16 — той же базе, что в продакшене
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: satti
          POSTGRES_DB: satti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Линтер (ruff)
        run: ruff check app tests
      - name: Тесты сервера на PostgreSQL 16 с покрытием (порог 90%)
        env:
          PYTHONIOENCODING: utf-8
          SATTI_TEST_DATABASE_URL: postgresql+psycopg://postgres:satti@127.0.0.1:5432/satti_test
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=90
      - name: Фаззинг API по OpenAPI (schemathesis, 60 примеров на операцию)
        env:
          SATTI_FUZZ_EXAMPLES: "60"
        run: python -m pytest -q tests/test_api_fuzz.py
      - name: Миграции на чистой базе PostgreSQL (вверх, проверка моделей, вниз, снова вверх)
        env:
          PGPASSWORD: satti
          DATABASE_URL: postgresql+psycopg://postgres:satti@127.0.0.1:5432/satti_migrations
          SATTI_DATA_DIR: ./ci-data
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE satti_migrations"
          python -m alembic upgrade head
          python -m alembic check
          SATTI_ALLOW_DOWNGRADE=1 python -m alembic downgrade base  # тестовая база CI; в продакшене откат без флага запрещён (QA-12)
          python -m alembic upgrade head
      - name: Миграции на SQLite (локальная разработка)
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
          SATTI_DATA_DIR: ./ci-data
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Статический анализ безопасности (bandit, medium и выше), блокирующий
        run: python -m bandit -r app -ll
      - name: Аудит зависимостей сервера
        run: pip-audit -r requirements.txt

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (правила Python, OWASP, секреты)
        run: semgrep scan --config p/python --config p/owasp-top-ten --config p/secrets --error --severity ERROR --severity WARNING server/app

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks по всей истории (версия 8.30.1)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --redact --no-banner

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Установка зависимостей
        run: npm ci
      - name: Тесты приложения с покрытием
        run: npx jest --coverage --coverageReporters=text-summary
      - name: Проверка типов
        run: npm run typecheck
      - name: Аудит зависимостей приложения (продакшен)
        run: npm audit --omit=dev --audit-level=high
