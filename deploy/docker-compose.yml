# Развёртывание Satti: приложение, PostgreSQL, Caddy (HTTPS). Секреты — в файле deploy/.env (не в git).
# Проверено только синтаксически (Docker на машине разработки не установлен). Запуск — deploy/deploy.sh.
name: satti

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: satti
      POSTGRES_USER: satti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satti -d satti"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${SATTI_IMAGE:-satti-server:latest}
    build:
      context: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://satti:${POSTGRES_PASSWORD}@db:5432/satti
      SATTI_TRUSTED_PROXIES: caddy
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SATTI_DOMAIN: ${SATTI_DOMAIN:?задайте SATTI_DOMAIN в deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
