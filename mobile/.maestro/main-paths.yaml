# Maestro: основные пути приложения (5.10). Запуск — когда появится эмулятор или устройство (5.3):
#   maestro test mobile/.maestro/main-paths.yaml
# Сценарии используют демо-магазин: регистрация не нужна, данные выдуманы.
appId: kz.satti.seller
---
- launchApp:
    clearState: true
- assertVisible: "Попробовать на демо-магазине"
- tapOn: "Попробовать на демо-магазине"
# Обзор: экран прибыли открыт
- extendedWaitUntil:
    visible: "Демо"
    timeout: 15000
# Вкладка «Заказы»
- tapOn: "Заказы"
- assertVisible: "Заказы"
# Вкладка «Товары» и карточка первого товара
- tapOn: "Товары"
- assertVisible: "Товары"
# Профиль: кнопка выхода показана, помощник скрыт (флаг выключен на запуске)
- tapOn: "Профиль"
- assertVisible: "Выйти"
- assertNotVisible: "Помощник"
# Выход из демо-режима
- tapOn: "Выйти"
- assertVisible: "Выйти из аккаунта?"
- tapOn: "Выйти"
- assertVisible: "Попробовать на демо-магазине"
